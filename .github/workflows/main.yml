name: Build kiev LineageOS 23.2

'on':
  workflow_dispatch:
    inputs:
      build_rom:
        description: Construire la ROM complète après bootimage
        required: true
        default: false
        type: boolean
      clean_sync:
        description: Supprimer la source LineageOS avant le build
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  LINEAGE_BRANCH: lineage-23.2
  DEVICE: kiev
  KSU_REF: v3.2.5
  SUSFS_PATCH_DIR: patches/susfs-kiev
  CCACHE_SIZE: 10G

jobs:
  build:
    # ubuntu-24.04 permet au job de démarrer sans runner auto-hébergé.
    # La compilation complète LineageOS peut toutefois manquer de stockage.
    runs-on: ubuntu-24.04
    timeout-minutes: 1440

    steps:
      - name: Récupérer build.sh et les patchs
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Installer les dépendances
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache curl erofs-utils flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick lib32readline-dev \
            lib32z1-dev libdw-dev libelf-dev libgnutls28-dev liblz4-tool \
            libncurses5-dev libncurses-dev libssl-dev libxml2 libxml2-utils \
            lz4 lzop pngcrush protobuf-compiler python3-protobuf repo rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev
          git lfs install

      - name: Préparer l’espace de travail
        shell: bash
        run: |
          set -euo pipefail
          echo "CPU: $(nproc)"
          free -h
          df -hT
          chmod +x build.sh
          if [ "${{ inputs.clean_sync }}" = "true" ]; then
            rm -rf lineage
          fi

      - name: Compiler
        shell: bash
        env:
          BUILD_ROM: ${{ inputs.build_rom }}
          USE_CCACHE: 1
        run: ./build.sh

      - name: Publier les artefacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kiev-lineage23.2-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            boot-kiev-lineage23.2-ksu-susfs.img
            kiev-effective-config.txt
            ccache-stats.txt
            lineage/out/target/product/kiev/boot.img
            lineage/out/target/product/kiev/recovery.img
            lineage/out/target/product/kiev/vendor_boot.img
            lineage/out/target/product/kiev/dtbo.img
            lineage/out/target/product/kiev/lineage-*.zip
