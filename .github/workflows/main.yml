name: Build kiev KernelSU SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REF: lineage-23.2
  KSU_REF: 0909ad8b04103581230800997d2bcbc6d30e223e
  BOOT_URL: https://mirrorbits.lineageos.org/full/kiev/20260809/boot.img
  PATCH_DIR: patches/susfs-kiev
  ANDROID_NDK_FALLBACK: 27.2.12479018

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Libérer de l’espace disque
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          df -h /

      - name: Installer les dépendances
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache clang curl flex git \
            libelf-dev libncurses-dev libssl-dev lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            make perl python3 unzip zip
          command -v clang
          command -v ld.lld
          command -v llvm-ar

      - name: Installer Rust et la cible Android
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Détecter le SDK Android préinstallé
        shell: bash
        run: |
          set -euo pipefail
          candidates=()
          [ -n "${ANDROID_SDK_ROOT:-}" ] && candidates+=("$ANDROID_SDK_ROOT")
          [ -n "${ANDROID_HOME:-}" ] && candidates+=("$ANDROID_HOME")
          candidates+=("/usr/local/lib/android/sdk" "$RUNNER_TOOL_CACHE/android-sdk")

          SDK=""
          for candidate in "${candidates[@]}"; do
            if [ -x "$candidate/cmdline-tools/latest/bin/sdkmanager" ] || \
               [ -x "$candidate/tools/bin/sdkmanager" ] || \
               [ -x "$candidate/cmdline-tools/bin/sdkmanager" ]; then
              SDK="$candidate"
              break
            fi
          done

          if [ -z "$SDK" ]; then
            echo "SDK Android introuvable." >&2
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          elif [ -x "$SDK/tools/bin/sdkmanager" ]; then
            echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          else
            echo "$SDK/cmdline-tools/bin" >> "$GITHUB_PATH"
          fi

      - name: Détecter ou installer le NDK Android
        shell: bash
        run: |
          set -euo pipefail
          NDK_ROOT=""
          if [ -d "$ANDROID_SDK_ROOT/ndk" ]; then
            NDK_ROOT="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
          fi

          if [ -z "$NDK_ROOT" ]; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager --install "ndk;${ANDROID_NDK_FALLBACK}"
            NDK_ROOT="$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_FALLBACK}"
          fi

          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"

      - name: Configurer ccache
        shell: bash
        run: |
          set -euo pipefail
          ccache --set-config=compression=true
          ccache -M 5G
          ccache -z

      - name: Compiler KernelSU, ksud et boot.img
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build.sh
          ./build.sh

      - name: Statistiques ccache
        if: always()
        shell: bash
        run: ccache -s > output/ccache-stats.txt 2>&1 || true

      - name: Publier les artefacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kiev-kernelsu-susfs-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: error
          path: output/*
