name: Build kiev kernel only

'on':
  workflow_dispatch:

permissions:
  contents: read

env:
  BOOT_URL: https://mirrorbits.lineageos.org/full/kiev/20260809/boot.img
  KSU_REF: v3.2.5
  SUSFS_PATCH_DIR: patches/susfs-kiev
  CCACHE_SIZE: 10G

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout du script et des patchs
        uses: actions/checkout@v4

      - name: Installer les outils
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache clang curl flex git \
            libelf-dev libssl-dev llvm lld make unzip zip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          chmod +x build-kernel-only.sh

      - name: Compiler le noyau et reconstruire boot.img
        shell: bash
        run: ./build-kernel-only.sh

      - name: Publier les artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiev-kernel-ksu-susfs-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            boot-kiev-ksu-susfs.img
            boot-kiev-ksu-susfs.sha256
            Image-kiev-ksu-susfs
            kiev-effective-config.txt
